<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            color: #1a3c5e;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 30px;
            margin-bottom: 25px;
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
        }
        .form-grid .full {
            grid-column: 1 / -1;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #1a3c5e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,60,94,0.2);
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .btn {
            background: #1a3c5e;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #0f2a44;
        }
        .btn-pdf {
            background: #d9534f;
            margin-left: 10px;
        }
        .btn-pdf:hover {
            background: #c9302c;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
        /* ESTILO DA OS (visualização) */
        #os-preview {
            margin-top: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #fff;
            font-size: 13px;
            line-height: 1.5;
        }
        #os-preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 12px;
        }
        #os-preview td, #os-preview th {
            border: 1px solid #222;
            padding: 4px 8px;
            vertical-align: top;
        }
        #os-preview .header-title {
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            background: #e9ecef;
        }
        #os-preview .section-title {
            font-weight: bold;
            background: #f1f3f5;
        }
        #os-preview .company-logo {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .signature-area {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .signature-area div {
            width: 45%;
        }
        .signature-line {
            border-bottom: 1px solid #000;
            margin-top: 30px;
            margin-bottom: 4px;
        }
        /* Responsivo */
        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .actions { flex-direction: column; align-items: stretch; }
            .btn-pdf { margin-left: 0; margin-top: 8px; }
        }

</head>

    });

        const func = selectFuncao.value;
        const dados = funcoesDB[func];
        if (!dados) return;
        document.getElementById('setor').value = dados.setor || '';
        // Atualizar preview automaticamente
        atualizarPreview();
    }

    // ============================================================
    // GERAR PDF
    // ============================================================
    function gerarPDF() {
        const element = document.getElementById('os-preview');
        if (!element.innerHTML.trim()) {
            alert('Primeiro atualize a visualização preenchendo os dados.');
            return;
        }
        // Ajustar largura para o PDF
        const opt = {
            margin:        [0.5, 0.5, 0.5, 0.5], // top, right, bottom, left (em polegadas)
            filename:     `OS_${document.getElementById('funcao').value}_${document.getElementById('nome').value || 'funcionario'}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, letterRendering: true, useCORS: true, logging: false },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // Carregar função inicial
    window.onload = function() {
        carregarDadosFuncao();
    };

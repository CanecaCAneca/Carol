<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro Glass</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --accent: #6366f1;
            --accent2: #8b5cf6;
            --accent3: #7c3aed;
            --green: #10b981;
            --green-dark: #059669;
            --red: #ef4444;
            --red-dark: #dc2626;
            --yellow: #f59e0b;
            --orange: #f97316;
            --bg-start: #eef2ff;
            --bg-end: #faf5ff;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.35);
            --text: #1e1b4b;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --shadow: 0 8px 32px rgba(99, 102, 241, 0.12);
            --shadow-hover: 0 12px 40px rgba(99, 102, 241, 0.22);
            --sidebar-bg: rgba(255, 255, 255, 0.65);
            --sidebar-border: rgba(255, 255, 255, 0.3);
            --input-bg: rgba(255, 255, 255, 0.85);
            --input-border: rgba(99, 102, 241, 0.2);
            --table-header-bg: rgba(99, 102, 241, 0.08);
            --table-row-hover: rgba(99, 102, 241, 0.05);
            --badge-green-bg: rgba(16, 185, 129, 0.15);
            --badge-green-text: #059669;
            --badge-red-bg: rgba(239, 68, 68, 0.15);
            --badge-red-text: #dc2626;
            --badge-yellow-bg: rgba(245, 158, 11, 0.15);
            --badge-yellow-text: #d97706;
            --badge-purple-bg: rgba(139, 92, 246, 0.15);
            --badge-purple-text: #7c3aed;
            --calendar-today: #6366f1;
            --calendar-selected: rgba(99, 102, 241, 0.2);
            --overlay-bg: rgba(30, 27, 75, 0.45);
            --toast-success: #10b981;
            --toast-error: #ef4444;
            --toast-info: #6366f1;
            --radius: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --sidebar-width-mini: 72px;
            --header-height: 64px;
        }

        [data-theme="dark"] {
            --bg-start: #0f0f1a;
            --bg-end: #1a1025;
            --card-bg: rgba(30, 27, 75, 0.75);
            --card-border: rgba(139, 92, 246, 0.2);
            --text: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.5);
            --sidebar-bg: rgba(20, 20, 35, 0.8);
            --sidebar-border: rgba(139, 92, 246, 0.15);
            --input-bg: rgba(30, 27, 75, 0.7);
            --input-border: rgba(139, 92, 246, 0.25);
            --table-header-bg: rgba(139, 92, 246, 0.12);
            --table-row-hover: rgba(139, 92, 246, 0.08);
            --badge-green-bg: rgba(16, 185, 129, 0.2);
            --badge-green-text: #34d399;
            --badge-red-bg: rgba(239, 68, 68, 0.2);
            --badge-red-text: #f87171;
            --badge-yellow-bg: rgba(245, 158, 11, 0.2);
            --badge-yellow-text: #fbbf24;
            --badge-purple-bg: rgba(139, 92, 246, 0.2);
            --badge-purple-text: #a78bfa;
            --calendar-today: #8b5cf6;
            --calendar-selected: rgba(139, 92, 246, 0.3);
            --overlay-bg: rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            transition: background 0.5s, color 0.5s;
            overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--sidebar-border);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: width var(--transition), transform var(--transition);
            overflow: hidden;
            flex-shrink: 0;
        }
        .sidebar.collapsed {
            width: var(--sidebar-width-mini);
        }
        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            min-height: var(--header-height);
        }
        .sidebar-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            color: #fff;
            font-weight: 700;
        }
        .sidebar-title {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s;
        }
        .sidebar.collapsed .sidebar-title {
            opacity: 0;
            width: 0;
        }
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            user-select: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            position: relative;
        }
        .nav-item:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
        }
        .nav-item.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }
        .nav-item .icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }
        .nav-item .label {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar.collapsed .nav-item .label {
            opacity: 0;
            width: 0;
            display: none;
        }
        .sidebar.collapsed .nav-item {
            justify-content: center;
            padding: 12px;
        }
        .sidebar.collapsed .nav-item .icon {
            margin: 0;
        }
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--sidebar-border);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar.collapsed .sidebar-footer {
            font-size: 0;
        }

        /* MAIN */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            transition: margin-left var(--transition);
            display: flex;
            flex-direction: column;
        }
        .main-wrapper.sidebar-collapsed {
            margin-left: var(--sidebar-width-mini);
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 900;
            min-height: var(--header-height);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: background 0.3s;
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
            padding: 4px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .hamburger:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            flex: 1;
            min-width: 120px;
        }
        .clock {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-decoration: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-accent {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }
        .page-section {
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .page-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARDS */
        .cards-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            transition: box-shadow 0.3s, transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }
        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .card-icon.green { background: var(--badge-green-bg); color: var(--badge-green-text); }
        .card-icon.red { background: var(--badge-red-bg); color: var(--badge-red-text); }
        .card-icon.purple { background: var(--badge-purple-bg); color: var(--badge-purple-text); }
        .card-icon.yellow { background: var(--badge-yellow-bg); color: var(--badge-yellow-text); }
        .card-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .card-value {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        .card-value.green { color: var(--green); }
        .card-value.red { color: var(--red); }
        .card-value.purple { color: var(--accent); }
        .card-value.yellow { color: var(--yellow); }
        .card-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

        /* FILTERS */
        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 120px;
            flex: 1 1 140px;
        }
        .filter-group label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .filter-group select,
        .filter-group input {
            padding: 9px 12px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 100%;
            cursor: pointer;
        }
        .filter-group select:focus,
        .filter-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .filter-group select option { background: var(--card-bg); color: var(--text); }

        /* TABLES */
        .table-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .table-scroll {
            overflow-x: auto;
            max-height: 420px;
            overflow-y: auto;
        }
        .table-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px; }
        table th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            background: var(--table-header-bg);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 1px solid var(--card-border);
        }
        table th:hover { background: rgba(99,102,241,0.12); }
        table th .sort-arrow { font-size: 0.65rem; margin-left: 4px; opacity: 0.7; }
        table td { padding: 10px 14px; border-bottom: 1px solid rgba(128,128,128,0.1); color: var(--text-secondary); white-space: nowrap; }
        table tbody tr { transition: background 0.15s; }
        table tbody tr:hover { background: var(--table-row-hover); }
        table tbody tr.debit-row { border-left: 4px solid var(--red); }
        table tbody tr.credit-row { border-left: 4px solid var(--green); }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-green { background: var(--badge-green-bg); color: var(--badge-green-text); }
        .badge-red { background: var(--badge-red-bg); color: var(--badge-red-text); }
        .badge-yellow { background: var(--badge-yellow-bg); color: var(--badge-yellow-text); }
        .badge-purple { background: var(--badge-purple-bg); color: var(--badge-purple-text); }
        .badge-orange { background: var(--badge-yellow-bg); color: var(--orange); }

        /* CHARTS */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            position: relative;
        }
        .chart-card canvas { max-height: 300px; width: 100% !important; }
        .chart-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; color: var(--text); }

        /* CALENDAR */
        .calendar-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .calendar-nav { display: flex; align-items: center; gap: 8px; }
        .calendar-nav button {
            padding: 8px 12px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .calendar-nav button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .calendar-title { font-size: 1.1rem; font-weight: 700; min-width: 160px; text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day-header {
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 8px 4px;
            letter-spacing: 0.5px;
        }
        .calendar-day {
            aspect-ratio: 1 / 1;
            border-radius: var(--radius-xs);
            padding: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            border: 1px solid transparent;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
            position: relative;
            background: rgba(128,128,128,0.05);
        }
        .calendar-day:hover { background: rgba(99,102,241,0.08); border-color: var(--input-border); transform: scale(1.02); }
        .calendar-day.today { border: 2px solid var(--calendar-today); background: rgba(99,102,241,0.08); }
        .calendar-day.selected { background: var(--calendar-selected); border: 2px solid var(--accent); }
        .calendar-day.other-month { opacity: 0.35; pointer-events: none; }
        .calendar-day .day-number { font-weight: 700; margin-bottom: 4px; font-size: 0.85rem; }
        .calendar-day .day-indicator {
            font-size: 0.68rem;
            line-height: 1.3;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .calendar-day .day-indicator.credit { color: var(--green); }
        .calendar-day .day-indicator.debit { color: var(--red); }

        /* TOASTS */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-hover);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            pointer-events: auto;
            animation: slideInRight 0.35s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 280px;
            max-width: 400px;
        }
        .toast.success { border-left: 4px solid var(--toast-success); }
        .toast.error { border-left: 4px solid var(--toast-error); }
        .toast.info { border-left: 4px solid var(--toast-info); }
        .toast .toast-icon { font-size: 1.2rem; flex-shrink: 0; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        .toast.removing { animation: fadeOut 0.3s ease forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(40px); } }

        /* LOADING OVERLAY */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.4s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
            .cards-row { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: var(--sidebar-width) !important; }
            .sidebar.mobile-open { transform: translateX(0); box-shadow: 4px 0 30px rgba(0,0,0,0.25); }

        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
    </style>
</head>

    <script>
        (function() {
            // ============ UTILITIES ============
            const $ = (sel, ctx = document) => ctx.querySelector(sel);
            const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

            function formatCurrency(val) {
                return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }
            function formatCurrencyCompact(val) {
                if (Math.abs(val) >= 1e6) return 'R$ ' + (val / 1e6).toFixed(1) + 'M';
                if (Math.abs(val) >= 1e3) return 'R$ ' + (val / 1e3).toFixed(1) + 'k';
                return formatCurrency(val);
            }
            function formatDateBR(dateObj) {
                if (!dateObj || isNaN(dateObj.getTime())) return '-';
                return dateObj.toLocaleDateString('pt-BR');
            }

            function parseCSV(text) {
                const rows = [];
                let row = [];
                let field = '';
                let inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const c = text[i];
                    if (inQuotes) {
                        if (c === '"') {
                            if (i + 1 < text.length && text[i + 1] === '"') { field += '"'; i++; }
                            else { inQuotes = false; }
                        } else { field += c; }
                    } else {
                        if (c === '"') { inQuotes = true; }
                        else if (c === ',') { row.push(field); field = ''; }
                        else if (c === '\n' || c === '\r') {
                            if (c === '\r' && i + 1 < text.length && text[i + 1] === '\n') i++;
                            row.push(field); field = '';
                            if (row.length > 1 || row[0] !== '') { rows.push(row); row = []; }
                        } else { field += c; }
                    }
                }
                if (field !== '' || row.length > 0) { row.push(field); if (row.length > 1 || row[0] !== '') rows.push(row); }
                return rows;
            }

            function normalizeHeader(h) {
                return String(h).toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]/g, '').trim();
            }

            function parseValueBR(val) {
                if (val == null) return 0;
                let s = String(val).trim();
                if (!s) return 0;
                s = s.replace(/R\$/gi, '').trim();
                let negative = s.startsWith('-');
                if (negative) s = s.substring(1);
                if (s.startsWith('(') && s.endsWith(')')) { negative = true; s = s.substring(1, s.length - 1); }
                if (s.includes(',')) { s = s.replace(/\./g, '').replace(',', '.'); }
                else {
                    const dotCount = (s.match(/\./g) || []).length;
                    if (dotCount === 1) { const parts = s.split('.'); s = parts[0] + '.' + parts[1]; }
                    else if (dotCount > 1) { s = s.replace(/\./g, ''); }
                }
                let num = parseFloat(s);
                if (isNaN(num)) num = 0;
                return negative ? -num : num;
            }

            function parseDateBR(val) {
                if (val == null) return null;
                let s = String(val).trim();
                if (!s) return null;
                let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
                if (m) {
                    let d = parseInt(m[1]), mo = parseInt(m[2]) - 1, y = parseInt(m[3]);
                    if (y < 100) y += 2000;
                    return new Date(y, mo, d);
                }
                m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
                if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
                let d = new Date(s);
                if (!isNaN(d.getTime())) return d;
                return null;
            }

            function normalizeStatus(s) {
                s = String(s).toLowerCase().trim();
                if (['true','pago','paga','quitado','ok','concluido','concluído'].includes(s)) return 'Pago';
                if (['false','pendente','vencido','atraso','atrasado','nao pago','não pago'].includes(s)) return 'Pendente';
                return s || 'Pendente';
            }

            function getDaysLate(dateObj, status) {
                if (!dateObj) return 0;
                const norm = normalizeStatus(status);
                if (norm === 'Pago') return 0;
                const now = new Date();
                const diff = now.getTime() - dateObj.getTime();
                return Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
            }

            // ============ DATA ============
            const SHEET_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSWlUNgP29Erp8Rh5AZPg430wul7T9IwPBPgozPQpO2ig9g8gpJoTn4JNfcKAbBSNH59VngkPE4A7dF/pub';
            const DEBITOS_GID = '1145670122';
            const CREDITOS_GID = '902301839';

            let allTransactions = [];
            let debitsData = [];
            let creditsData = [];
            let dataLoaded = false;

            const state = {
                currentPage: 'resumo',
                theme: localStorage.getItem('dash_theme') || 'light',
                sidebarCollapsed: localStorage.getItem('dash_sidebar') === 'collapsed',
                mobileSidebarOpen: false,
                charts: {},
                filters: {
                    resumo: { categoria:'', pessoa:'', status:'', forma:'', banco:'', ano:'', mes:'', dia:'' },
                    debitos: { categoria:'', pessoa:'', status:'', forma:'', banco:'', ano:'', mes:'', dia:'' },
                    creditos: { categoria:'', pessoa:'', status:'', forma:'', banco:'', ano:'', mes:'', dia:'' },
                    dre: { ano:'', mes:'' },
                    bancos: { ano:'', mes:'' },
                    pessoas: { ano:'', mes:'' },
                    formas: { ano:'', mes:'' },
                    inadimplencia: { tipo:'todos', ano:'', mes:'' },
                    comparativo: { ano:'' },
                    analise: { ano:'' },
                },
                sort: { tableId:null, column:null, direction:'asc' },
                calendarMonth: { year:new Date().getFullYear(), month:new Date().getMonth() },
                calendarSelectedDate: null,
                debitosCalendarMonth: { year:new Date().getFullYear(), month:new Date().getMonth() },
                creditosCalendarMonth: { year:new Date().getFullYear(), month:new Date().getMonth() },
            };

            // ============ FETCH & PROCESSING ============
            async function fetchCSV(gid) {
                const url = `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
                const resp = await fetch(url, { cache: 'no-store' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                // Basic check: if response looks like HTML, it's an error
                if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                    throw new Error('Resposta inválida (HTML)');
                }
                return text;
            }

            function processCSV(csvText, tipo) {
                const rows = parseCSV(csvText);
                if (rows.length < 2) return [];
                const headers = rows[0].map(normalizeHeader);
                const dataIdx = headers.findIndex(h => h.includes('data') || h.includes('date'));
                const descIdx = headers.findIndex(h => h.includes('descricao') || h.includes('desc') || h.includes('historico'));
                const catIdx = headers.findIndex(h => h.includes('categoria') || h.includes('cat') || h.includes('tipo'));
                const valIdx = headers.findIndex(h => h.includes('valor') || h.includes('value') || h.includes('amount') || h.includes('preco'));
                const statusIdx = headers.findIndex(h => h.includes('status') || h.includes('situacao') || h.includes('pago'));
                const formaIdx = headers.findIndex(h => h.includes('forma') || h.includes('pagamento') || h.includes('metodo'));
                const bancoIdx = headers.findIndex(h => h.includes('banco') || h.includes('bank') || h.includes('instituicao'));
                const pessoaIdx = headers.findIndex(h => h.includes('pessoa') || h.includes('nome') || h.includes('cliente') || h.includes('fornecedor'));

                if (dataIdx === -1 || valIdx === -1) {
                    console.warn('CSV sem colunas de data/valor', headers);
                    return [];
                }

                const result = [];
                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r || r.length === 0 || r.every(c => !c || c.trim() === '')) continue;
                    const rawData = dataIdx >= 0 ? r[dataIdx] : '';
                    const dateObj = parseDateBR(rawData);
                    const rawVal = valIdx >= 0 ? r[valIdx] : '0';
                    const valNum = parseValueBR(rawVal);
                    const rawStatus = statusIdx >= 0 ? r[statusIdx] : 'false';
                    const statusNorm = normalizeStatus(rawStatus);
                    const desc = descIdx >= 0 ? (r[descIdx] || '') : '';
                    const cat = catIdx >= 0 ? (r[catIdx] || 'Sem categoria') : 'Sem categoria';
                    const forma = formaIdx >= 0 ? (r[formaIdx] || 'Não informado') : 'Não informado';
                    const banco = bancoIdx >= 0 ? (r[bancoIdx] || 'Não informado') : 'Não informado';
                    const pessoa = pessoaIdx >= 0 ? (r[pessoaIdx] || 'Não informado') : 'Não informado';

                    result.push({
                        data: rawData,
                        dataOriginal: rawData,
                        dateObj: dateObj,
                        descricao: desc,
                        categoria: cat,
                        valor: valNum,
                        valorAbs: Math.abs(valNum),
                        status: statusNorm,
                        statusRaw: rawStatus,
                        formaPagamento: forma,
                        banco: banco,
                        pessoa: pessoa,
                        tipo: tipo,
                        dia: dateObj ? dateObj.getDate() : 0,
                        mes: dateObj ? dateObj.getMonth() : 0,
                        mesLabel: dateObj ? dateObj.toLocaleDateString('pt-BR', { month: 'long' }) : '',
                        ano: dateObj ? dateObj.getFullYear() : 0,
                        daysLate: getDaysLate(dateObj, statusNorm),
                    });
                }
                return result;
            }

            async function loadData(showToast = true) {
                const overlay = $('#loadingOverlay');
                overlay.classList.remove('hidden');
                try {
                    const [debCsv, credCsv] = await Promise.all([
                        fetchCSV(DEBITOS_GID),
                        fetchCSV(CREDITOS_GID),
                    ]);
                    debitsData = processCSV(debCsv, 'debito');
                    creditsData = processCSV(credCsv, 'credito');
                    allTransactions = [...debitsData, ...creditsData];
                    dataLoaded = true;
                    renderCurrentPage();
                    if (showToast) showToast('Dados carregados com sucesso!', 'success');
                } catch (err) {
                    console.error('Erro ao carregar dados:', err);
                    if (showToast) showToast('Erro ao carregar dados: ' + err.message, 'error');
                    // Keep previous data if available, else set empty
                    if (allTransactions.length === 0) {
                        debitsData = [];
                        creditsData = [];
                        allTransactions = [];
                        dataLoaded = true;
                        renderCurrentPage();
                    }
                } finally {
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
            }

            // ============ HELPERS ============
            function getUniqueValues(key, data) {
                const set = new Set();
                data.forEach(t => { if (t[key]) set.add(t[key]); });
                return [...set].sort((a, b) => String(a).localeCompare(String(b), 'pt-BR'));
            }
            function getYears(data) {
                const years = new Set();
                data.forEach(t => { if (t.ano) years.add(t.ano); });
                const arr = [...years].sort((a, b) => b - a);
                if (arr.length === 0) arr.push(new Date().getFullYear());
                return arr;
            }
            function getMonthLabel(m) {
                const names = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
                return names[m] || '';
            }
            function filterTransactions(data, filters) {
                return data.filter(t => {
                    if (filters.categoria && t.categoria !== filters.categoria) return false;
                    if (filters.pessoa && t.pessoa !== filters.pessoa) return false;
                    if (filters.status && t.status !== filters.status) return false;
                    if (filters.forma && t.formaPagamento !== filters.forma) return false;
                    if (filters.banco && t.banco !== filters.banco) return false;
                    if (filters.ano && t.ano !== parseInt(filters.ano)) return false;
                    if (filters.mes && t.mes !== parseInt(filters.mes)) return false;
                    if (filters.dia && t.dia !== parseInt(filters.dia)) return false;
                    return true;
                });
            }
            function getFilteredData(page) {
                const f = state.filters[page] || {};
                if (page === 'resumo') return filterTransactions(allTransactions, f);
                if (page === 'debitos') return filterTransactions(debitsData, f);
                if (page === 'creditos') return filterTransactions(creditsData, f);
                if (page === 'inadimplencia') {
                    const base = f.tipo === 'credito' ? creditsData : f.tipo === 'debito' ? debitsData : allTransactions;
                    return filterTransactions(base, f);
                }
                return allTransactions;
            }
            function sumByType(data, tipo) {
                return data.filter(t => t.tipo === tipo).reduce((sum, t) => sum + t.valorAbs, 0);
            }
            function getMonthKey(t) { return `${t.ano}-${String(t.mes + 1).padStart(2, '0')}`; }
            function groupByMonth(data, tipo) {
                const map = {};
                data.filter(t => t.tipo === tipo || !tipo).forEach(t => {
                    const key = getMonthKey(t);
                    if (!map[key]) map[key] = { key, ano: t.ano, mes: t.mes, total: 0, count: 0 };
                    map[key].total += t.valorAbs;
                    map[key].count++;
                });
                return Object.values(map).sort((a, b) => a.key.localeCompare(b.key));
            }
            function groupByYear(data, tipo) {
                const map = {};
                data.filter(t => t.tipo === tipo || !tipo).forEach(t => {
                    const key = String(t.ano);
                    if (!map[key]) map[key] = { ano: t.ano, total: 0, count: 0 };
                    map[key].total += t.valorAbs;
                    map[key].count++;
                });
                return Object.values(map).sort((a, b) => a.ano - b.ano);
            }
            function groupByCategory(data, tipo) {
                const map = {};
                data.filter(t => t.tipo === tipo).forEach(t => {
                    const key = t.categoria;
                    if (!map[key]) map[key] = { categoria: key, total: 0, count: 0 };
                    map[key].total += t.valorAbs;
                    map[key].count++;
                });
                return Object.values(map).sort((a, b) => b.total - a.total);
            }
            function groupByBanco(data, tipo) {
                const map = {};
                data.filter(t => t.tipo === tipo).forEach(t => {
                    const key = t.banco;
                    if (!map[key]) map[key] = { banco: key, total: 0, count: 0 };
                    map[key].total += t.valorAbs;
                    map[key].count++;
                });
                return Object.values(map).sort((a, b) => b.total - a.total);
            }
            function groupByPessoa(data, tipo) {
                const map = {};
                data.filter(t => t.tipo === tipo).forEach(t => {
                    const key = t.pessoa;
                    if (!map[key]) map[key] = { pessoa: key, total: 0, count: 0 };
                    map[key].total += t.valorAbs;
                    map[key].count++;
                });
                return Object.values(map).sort((a, b) => b.total - a.total);
            }
            function groupByForma(data, tipo) {
                const map = {};
                data.filter(t => t.tipo === tipo).forEach(t => {
                    const key = t.formaPagamento;
                    if (!map[key]) map[key] = { forma: key, total: 0, count: 0 };
                    map[key].total += t.valorAbs;
                    map[key].count++;
                });
                return Object.values(map).sort((a, b) => b.total - a.total);
            }
            function getTransactionsForDay(data, year, month, day) {
                return data.filter(t => t.ano === year && t.mes === month && t.dia === day);
            }

            // ============ FILTERS ============
            function populateFilterSelect(selectEl, values, selectedVal, isMonth = false) {
                if (!selectEl) return;
                const currentVal = selectedVal !== undefined && selectedVal !== null ? String(selectedVal) : '';
                selectEl.innerHTML = '<option value="">Todos</option>';
                values.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = String(v);
                    opt.textContent = isMonth ? getMonthLabel(parseInt(v)) : String(v);
                    if (String(v) === currentVal) opt.selected = true;
                    selectEl.appendChild(opt);
                });
            }

            function buildFiltersBar(page, containerId, filterConfig) {
                const container = document.getElementById(containerId);
                if (!container) return;
                let html = '';
                filterConfig.forEach(cfg => {
                    html += `<div class="filter-group"><label>${cfg.label}</label><select id="${page}-${cfg.id}" data-page="${page}" data-filter="${cfg.id}"></select></div>`;
                });
                container.innerHTML = html;
                filterConfig.forEach(cfg => {
                    const selectEl = document.getElementById(`${page}-${cfg.id}`);
                    if (!selectEl) return;
                    const currentVal = state.filters[page] ? state.filters[page][cfg.id] : '';
                    let values = [];
                    if (cfg.id === 'ano') values = getYears(allTransactions).map(String);
                    else if (cfg.id === 'mes') values = Array.from({ length: 12 }, (_, i) => i);
                    else if (cfg.id === 'dia') values = Array.from({ length: 31 }, (_, i) => i + 1);
                    else if (cfg.id === 'tipo') values = ['todos', 'credito', 'debito'];
                    else {
                        const dataSource = page === 'debitos' ? debitsData : page === 'creditos' ? creditsData : allTransactions;
                        values = getUniqueValues(cfg.id, dataSource);
                    }
                    populateFilterSelect(selectEl, values, currentVal, cfg.id === 'mes');
                    selectEl.addEventListener('change', function() {
                        const val = this.value;
                        const p = this.dataset.page;
                        const f = this.dataset.filter;
                        if (state.filters[p]) state.filters[p][f] = val;
                        renderCurrentPage();
                    });
                });
            }

            // ============ CHARTS ============
            function destroyAllCharts() {
                Object.values(state.charts).forEach(chart => {
                    try { chart.destroy(); } catch (e) {}
                });
                state.charts = {};
            }

            function createDoughnutChart(canvasId, labels, values, colors) {
                const canvas = document.getElementById(canvasId);
                if (!canvas || typeof Chart === 'undefined') return;
                if (state.charts[canvasId]) { try { state.charts[canvasId].destroy(); } catch (e) {} }
                const ctx = canvas.getContext('2d');
                state.charts[canvasId] = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2 }] },
                    options: { responsive: true, maintainAspectRatio: true,
                        plugins: { legend: { position: 'right', labels: { font: { size: 11 }, color: getComputedStyle(document.body).getPropertyValue('--text-secondary') } } } }
                });
            }

            function createBarChart(canvasId, labels, datasets) {
                const canvas = document.getElementById(canvasId);
                if (!canvas || typeof Chart === 'undefined') return;

                state.charts[canvasId] = new Chart(ctx, {
                    type: 'bar',
                    data: { labels, datasets },
                    options: { responsive: true, maintainAspectRatio: true,

            function createLineChart(canvasId, labels, datasets) {

            // ============ TABLE ============
            function renderTable(containerId, data, columns, options = {}) {
                const container = document.getElementById(containerId);
                if (!container) return;
                if (data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>Nenhum registro encontrado.</p></div>`;
                    return;
                }
                const { sortColumn, sortDirection } = options;
                let sortedData = [...data];
                if (sortColumn) {
                    const col = columns.find(c => c.key === sortColumn);
                    if (col) {
                        sortedData.sort((a, b) => {
                            const va = col.getSortValue ? col.getSortValue(a) : a[col.key];
                            const vb = col.getSortValue ? col.getSortValue(b) : b[col.key];
                            if (typeof va === 'number' && typeof vb === 'number') return sortDirection === 'asc' ? va - vb : vb - va;
                            return sortDirection === 'asc' ? String(va).localeCompare(String(vb), 'pt-BR') : String(vb).localeCompare(String(va), 'pt-BR');
                        });
                    }
                }
                let html = '<table><thead><tr>';
                columns.forEach(col => {
                    const arrow = sortColumn === col.key ? (sortDirection === 'asc' ? '▲' : '▼') : '';
                    html += `<th data-column="${col.key}" title="Clique para ordenar">${col.label} <span class="sort-arrow">${arrow}</span></th>`;
                });
                html += '</tr></thead><tbody>';
                sortedData.forEach((row, idx) => {
                    const rowClass = row.tipo === 'debito' ? 'debit-row' : row.tipo === 'credito' ? 'credit-row' : '';
                    html += `<tr class="${rowClass}">`;
                    columns.forEach(col => {
                        html += `<td>${col.render ? col.render(row, idx) : (row[col.key] ?? '')}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
                container.querySelectorAll('th[data-column]').forEach(th => {
                    th.addEventListener('click', () => {
                        const colKey = th.dataset.column;
                        if (state.sort.tableId === containerId && state.sort.column === colKey) {
                            state.sort.direction = state.sort.direction === 'asc' ? 'desc' : 'asc';
                        } else {
                            state.sort.tableId = containerId;
                            state.sort.column = colKey;
                            state.sort.direction = 'asc';
                        }
                        renderCurrentPage();
                    });
                });
            }

            // ============ CALENDAR ============
            function renderCalendar(containerId, data, year, month, options = {}) {
                const container = document.getElementById(containerId);
                if (!container) return;
                const { filterTipo, showBothTypes } = options;
                const firstDay = new Date(year, month, 1);
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const startDOW = firstDay.getDay();
                const today = new Date();
                const selectedDate = state.calendarSelectedDate;
                let html = `<div class="calendar-header">
                    <div class="calendar-nav">
                        <button data-cal-action="prev" data-year="${year}" data-month="${month}" data-container="${containerId}">◀</button>
                        <button data-cal-action="today" data-container="${containerId}">Hoje</button>
                        <button data-cal-action="next" data-year="${year}" data-month="${month}" data-container="${containerId}">▶</button>
                    </div>
                    <div class="calendar-title">${getMonthLabel(month)} ${year}</div>
                </div>`;
                html += '<div class="calendar-grid">';
                ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d => html += `<div class="calendar-day-header">${d}</div>`);
                for (let i = 0; i < startDOW; i++) html += '<div class="calendar-day other-month"></div>';
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateObj = new Date(year, month, day);
                    const isToday = dateObj.toDateString() === today.toDateString();
                    const isSelected = selectedDate && selectedDate.getFullYear() === year && selectedDate.getMonth() === month && selectedDate.getDate() === day;
                    const dayData = data.filter(t => t.ano === year && t.mes === month && t.dia === day);
                    let creditTotal = 0, debitTotal = 0;
                    dayData.forEach(t => { if (t.tipo === 'credito') creditTotal += t.valorAbs; else debitTotal += t.valorAbs; });
                    let indicatorHtml = '';
                    if (showBothTypes || !filterTipo) {
                        if (creditTotal > 0) indicatorHtml += `<div class="day-indicator credit">+${formatCurrencyCompact(creditTotal)}</div>`;
                        if (debitTotal > 0) indicatorHtml += `<div class="day-indicator debit">-${formatCurrencyCompact(debitTotal)}</div>`;
                    } else if (filterTipo === 'credito' && creditTotal > 0) {
                        indicatorHtml = `<div class="day-indicator credit">+${formatCurrencyCompact(creditTotal)}</div>`;
                    } else if (filterTipo === 'debito' && debitTotal > 0) {
                        indicatorHtml = `<div class="day-indicator debit">-${formatCurrencyCompact(debitTotal)}</div>`;
                    }
                    html += `<div class="calendar-day${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" 
                        data-day="${day}" data-month="${month}" data-year="${year}" data-container="${containerId}">
                        <div class="day-number">${day}</div>${indicatorHtml}</div>`;
                }
                html += '</div>';
                container.innerHTML = html;
                container.querySelectorAll('.calendar-nav button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const action = btn.dataset.calAction;
                        const y = parseInt(btn.dataset.year) || year;
                        const m = parseInt(btn.dataset.month) || month;
                        if (action === 'prev') { const nd = new Date(y, m - 1, 1); state.calendarMonth = { year: nd.getFullYear(), month: nd.getMonth() }; }
                        else if (action === 'next') { const nd = new Date(y, m + 1, 1); state.calendarMonth = { year: nd.getFullYear(), month: nd.getMonth() }; }
                        else if (action === 'today') { const now = new Date(); state.calendarMonth = { year: now.getFullYear(), month: now.getMonth() }; }
                        renderCurrentPage();
                    });
                });
                container.querySelectorAll('.calendar-day[data-day]').forEach(el => {
                    el.addEventListener('click', () => {
                        const day = parseInt(el.dataset.day);
                        const m = parseInt(el.dataset.month);
                        const y = parseInt(el.dataset.year);
                        state.calendarSelectedDate = new Date(y, m, day);
                        renderCurrentPage();
                    });
                });
            }

            // ============ PAGE RENDERERS ============
            function renderCurrentPage() {
                if (!dataLoaded) return;
                destroyAllCharts();
                const page = state.currentPage;
                const titles = {
                    resumo: 'Resumo Geral', debitos: 'Débitos', creditos: 'Créditos', dre: 'D.R.E.',
                    tendencias: 'Tendências', bancos: 'Bancos', pessoas: 'Pessoas', formas: 'Formas de Pagamento',
                    inadimplencia: 'Inadimplência', calendario: 'Calendário Geral', comparativo: 'Comparativo Anual', analise: 'Análise Mensal'
                };
                $('#headerTitle').textContent = titles[page] || 'Dashboard';
                $$('.page-section').forEach(s => s.classList.remove('active'));
                const section = $(`#page-${page}`);
                if (section) section.classList.add('active');
                $$('.nav-item').forEach(n => n.classList.remove('active'));
                const navBtn = $(`.nav-item[data-page="${page}"]`);
                if (navBtn) navBtn.classList.add('active');

                switch (page) {
                    case 'resumo': renderResumo(); break;
                    case 'debitos': renderDebitos(); break;
                    case 'creditos': renderCreditos(); break;
                    case 'dre': renderDRE(); break;
                    case 'tendencias': renderTendencias(); break;
                    case 'bancos': renderBancos(); break;
                    case 'pessoas': renderPessoas(); break;
                    case 'formas': renderFormas(); break;
                    case 'inadimplencia': renderInadimplencia(); break;
                    case 'calendario': renderCalendarioGeralPage(); break;
                    case 'comparativo': renderComparativo(); break;
                    case 'analise': renderAnalise(); break;
                }
            }

            // --- RESUME ---

            // --- TENDÊNCIAS ---
            function renderTendencias() {
                const monthlyCred = groupByMonth(creditsData, 'credito').sort((a,b) => a.key.localeCompare(b.key));
                const monthlyDeb = groupByMonth(debitsData, 'debito').sort((a,b) => a.key.localeCompare(b.key));
                const totalCred = monthlyCred.reduce((s,m) => s + m.total, 0);
                const totalDeb = monthlyDeb.reduce((s,m) => s + m.total, 0);
                function linReg(data) {
                    if (data.length < 2) return { slope: 0, intercept: data.length > 0 ? data[0].total : 0 };
                    const n = data.length;
                    const xs = data.map((_, i) => i);
                    const ys = data.map(d => d.total);
                    const sumX = xs.reduce((a,b) => a+b,0);
                    const sumY = ys.reduce((a,b) => a+b,0);
                    const sumXY = xs.reduce((a,x,i) => a + x*ys[i], 0);
                    const sumXX = xs.reduce((a,x) => a + x*x, 0);
                    const slope = (n*sumXY - sumX*sumY) / (n*sumXX - sumX*sumX);
                    const intercept = (sumY - slope*sumX) / n;
                    return { slope, intercept };
                }
                const regCred = linReg(monthlyCred);
                const regDeb = linReg(monthlyDeb);
                const histLabels = monthlyCred.map(m => getMonthLabel(m.mes) + '/' + m.ano);
                const credHistVals = monthlyCred.map(m => m.total);
                const debHistVals = monthlyDeb.map(m => m.total);
                const projCount = 6;
                const projLabels = [];
                const credProjVals = [];
                const debProjVals = [];
                const lastIdx = Math.max(monthlyCred.length, monthlyDeb.length) - 1;
                for (let i = 1; i <= projCount; i++) {
                    const idx = lastIdx + i;
                    const credProj = regCred.intercept + regCred.slope * idx;
                    const debProj = regDeb.intercept + regDeb.slope * idx;
                    const lastMonth = monthlyCred.length > 0 ? monthlyCred[monthlyCred.length - 1] : { mes: new Date().getMonth(), ano: new Date().getFullYear() };
                    const nextDate = new Date(lastMonth.ano, lastMonth.mes + i, 1);
                    projLabels.push(getMonthLabel(nextDate.getMonth()) + '/' + nextDate.getFullYear());
                    credProjVals.push(Math.max(0, credProj));
                    debProjVals.push(Math.max(0, debProj));
                }
                const allLabels = [...histLabels, ...projLabels];
                const credFull = [...credHistVals, ...credProjVals];
                const debFull = [...debHistVals, ...debProjVals];
                const credGrowth = monthlyCred.length > 1 && regCred.intercept !== 0 ? ((regCred.slope * (monthlyCred.length - 1)) / (regCred.intercept + regCred.slope * (monthlyCred.length - 1))) * 100 : 0;
                const debGrowth = monthlyDeb.length > 1 && regDeb.intercept !== 0 ? ((regDeb.slope * (monthlyDeb.length - 1)) / (regDeb.intercept + regDeb.slope * (monthlyDeb.length - 1))) * 100 : 0;
                const projReceita = regCred.intercept + regCred.slope * (lastIdx + 1);
                const projResultado = projReceita - (regDeb.intercept + regDeb.slope * (lastIdx + 1));
                $('#tendenciasCards').innerHTML = `
                    <div class="card"><div class="card-icon green">📈</div><div class="card-label">Crescimento Receitas</div><div class="card-value green">${credGrowth.toFixed(1)}%</div><div class="card-sub">Taxa de crescimento</div></div>
                    <div class="card"><div class="card-icon red">📉</div><div class="card-label">Crescimento Despesas</div><div class="card-value red">${debGrowth.toFixed(1)}%</div><div class="card-sub">Taxa de crescimento</div></div>
                    <div class="card"><div class="card-icon purple">💹</div><div class="card-label">Projeção de Receita</div><div class="card-value purple">${formatCurrency(projReceita)}</div><div class="card-sub">Próximo mês</div></div>
                    <div class="card"><div class="card-icon yellow">🎯</div><div class="card-label">Projeção de Resultado</div><div class="card-value yellow">${formatCurrency(projResultado)}</div><div class="card-sub">Próximo mês</div></div>
                `;
                $('#tendenciasCharts').innerHTML = `
                    <div class="chart-card"><div class="chart-title">Projeção (Linha: histórica sólida + projeção tracejada)</div><canvas id="chart-tendencias-projecao"></canvas></div>
                    <div class="chart-card"><div class="chart-title">Sazonalidade (Médias Mensais)</div><canvas id="chart-tendencias-sazonalidade"></canvas></div>
                `;
                const canvasProj = document.getElementById('chart-tendencias-projecao');
                if (canvasProj && typeof Chart !== 'undefined') {
                    if (state.charts['chart-tendencias-projecao']) state.charts['chart-tendencias-projecao'].destroy();
                    const ctx = canvasProj.getContext('2d');
                    const histEnd = histLabels.length;
                    const credData = credFull.map((v, i) => i >= histEnd ? null : v);
                    const debData = debFull.map((v, i) => i >= histEnd ? null : v);
                    const credProjData = credFull.map((v, i) => i >= histEnd - 1 ? v : null);
                    const debProjData = debFull.map((v, i) => i >= histEnd - 1 ? v : null);
                    state.charts['chart-tendencias-projecao'] = new Chart(ctx, {
                        type: 'line',
                        data: { labels: allLabels, datasets: [
                            { label: 'Receitas (hist)', data: credData, borderColor: 'var(--green)', backgroundColor: 'rgba(16,185,129,0.12)', fill: true, tension: 0.35, spanGaps: false },
                            { label: 'Despesas (hist)', data: debData, borderColor: 'var(--red)', backgroundColor: 'rgba(239,68,68,0.12)', fill: true, tension: 0.35, spanGaps: false },
                            { label: 'Receitas (proj)', data: credProjData, borderColor: 'var(--green)', borderDash: [6, 6], pointStyle: 'triangle', fill: false, tension: 0.35, spanGaps: false },
                            { label: 'Despesas (proj)', data: debProjData, borderColor: 'var(--red)', borderDash: [6, 6], pointStyle: 'triangle', fill: false, tension: 0.35, spanGaps: false },
                        ]},
                        options: { responsive: true, maintainAspectRatio: true,
                            plugins: { legend: { position: 'top', labels: { font: { size: 10 }, color: getComputedStyle(document.body).getPropertyValue('--text-secondary') } } },
                            scales: { y: { beginAtZero: true, ticks: { font: { size: 10 }, color: getComputedStyle(document.body).getPropertyValue('--text-muted') } },
                                x: { ticks: { font: { size: 9 }, color: getComputedStyle(document.body).getPropertyValue('--text-muted'), maxRotation: 45 }, grid: { display: false } } } }
                    });
                }
                // Sazonalidade
                const monthNames = Array.from({ length: 12 }, (_, i) => getMonthLabel(i));
                const avgCred = new Array(12).fill(0); const avgDeb = new Array(12).fill(0);
                const countCred = new Array(12).fill(0); const countDeb = new Array(12).fill(0);
                creditsData.forEach(t => { if (t.mes >= 0 && t.mes < 12) { avgCred[t.mes] += t.valorAbs; countCred[t.mes]++; } });
                debitsData.forEach(t => { if (t.mes >= 0 && t.mes < 12) { avgDeb[t.mes] += t.valorAbs; countDeb[t.mes]++; } });
                const avgCredArr = monthNames.map((_, i) => countCred[i] > 0 ? avgCred[i] / countCred[i] : 0);
                const avgDebArr = monthNames.map((_, i) => countDeb[i] > 0 ? avgDeb[i] / countDeb[i] : 0);
                createBarChart('chart-tendencias-sazonalidade', monthNames, [
                    { label: 'Receitas Média', data: avgCredArr, backgroundColor: 'rgba(16,185,129,0.7)', borderRadius: 6 },
                    { label: 'Despesas Média', data: avgDebArr, backgroundColor: 'rgba(239,68,68,0.7)', borderRadius: 6 },
                ]);
            }

                        { key: 'categoria', label: 'Categoria' },
                        { key: 'valor', label: 'Valor', render: t => `<span style="color:${t.tipo==='credito'?'var(--green)':'var(--red)'}">${formatCurrency(t.valor)}</span>`, getSortValue: t => t.valor },
                        { key: 'status', label: 'Status' },
                        { key: 'banco', label: 'Banco' },
                        { key: 'pessoa', label: 'Pessoa' }
                    ], { sortColumn: null, sortDirection: 'asc' });
                } else {
                    $('#calendarioTable').innerHTML = '<div class="empty-state"><div class="icon">👆</div><p>Clique em um dia para ver as transações.</p></div>';
                }
            }

            // --- COMPARATIVO ANUAL ---
            function renderComparativo() {
                buildFiltersBar('comparativo', 'comparativoFilters', [ { id:'ano', label:'Ano' } ]);
                const f = state.filters.comparativo;
                let data = allTransactions;
                if (f.ano) data = data.filter(t => t.ano === parseInt(f.ano));
                const anoAtual = f.ano ? parseInt(f.ano) : new Date().getFullYear();
                const receita = sumByType(data.filter(t => t.ano === anoAtual), 'credito');
                const despesa = sumByType(data.filter(t => t.ano === anoAtual), 'debito');
                const resultado = receita - despesa;
                $('#comparativoCards').innerHTML = `
                    <div class="card"><div class="card-icon green">📈</div><div class="card-label">Receita (${anoAtual})</div><div class="card-value green">${formatCurrency(receita)}</div></div>
                    <div class="card"><div class="card-icon red">📉</div><div class="card-label">Despesa (${anoAtual})</div><div class="card-value red">${formatCurrency(despesa)}</div></div>
                    <div class="card"><div class="card-icon purple">💰</div><div class="card-label">Resultado</div><div class="card-value purple">${formatCurrency(resultado)}</div></div>
                `;
                const yearData = groupByYear(data, null);
                const tableData = yearData.map(y => {
                    const rec = sumByType(data.filter(t => t.ano === y.ano && t.tipo === 'credito'), 'credito');
                    const desp = sumByType(data.filter(t => t.ano === y.ano && t.tipo === 'debito'), 'debito');
                    const res = rec - desp;
                    const margem = rec > 0 ? (res / rec) * 100 : 0;
                    return { ano: y.ano, receitas: rec, despesas: desp, resultado: res, margem: margem };
                });
                renderTable('comparativoTable', tableData, [
                    { key: 'ano', label: 'Ano' },
                    { key: 'receitas', label: 'Receitas', render: r => formatCurrency(r.receitas), getSortValue: r => r.receitas },
                    { key: 'despesas', label: 'Despesas', render: r => formatCurrency(r.despesas), getSortValue: r => r.despesas },
                    { key: 'resultado', label: 'Resultado', render: r => `<span style="color:${r.resultado>=0?'var(--green)':'var(--red)'}">${formatCurrency(r.resultado)}</span>`, getSortValue: r => r.resultado },
                    { key: 'margem', label: 'Margem (%)', render: r => `${r.margem.toFixed(1)}%`, getSortValue: r => r.margem }
                ], { sortColumn: null, sortDirection: 'asc' });
            }

            // --- ANÁLISE MENSAL ---
            function renderAnalise() {
                buildFiltersBar('analise', 'analiseFilters', [ { id:'ano', label:'Ano' } ]);
                const f = state.filters.analise;
                const anoAtual = f.ano ? parseInt(f.ano) : new Date().getFullYear();
                const data = allTransactions.filter(t => t.ano === anoAtual);
                const monthData = [];
                for (let m = 0; m < 12; m++) {
                    const monthEntries = data.filter(t => t.mes === m);
                    const rec = sumByType(monthEntries, 'credito');
                    const desp = sumByType(monthEntries, 'debito');
                    const saldo = rec - desp;
                    const margem = rec > 0 ? (saldo / rec) * 100 : 0;
                    monthData.push({ mes: m, mesLabel: getMonthLabel(m), receitas: rec, despesas: desp, saldo: saldo, margem: margem, acumulado: 0 });
                }
                let acum = 0;
                monthData.forEach(m => { acum += m.saldo; m.acumulado = acum; });
                const activeMonths = monthData.filter(m => m.receitas > 0 || m.despesas > 0);
                const melhorMes = activeMonths.length > 0 ? [...activeMonths].sort((a, b) => b.saldo - a.saldo)[0] : null;
                const piorMes = activeMonths.length > 0 ? [...activeMonths].sort((a, b) => a.saldo - b.saldo)[0] : null;
                const mediaMensal = activeMonths.length > 0 ? activeMonths.reduce((s, m) => s + m.saldo, 0) / activeMonths.length : 0;
                const mesesPositivos = activeMonths.filter(m => m.saldo > 0).length;
                $('#analiseCards').innerHTML = `
                    <div class="card"><div class="card-icon green">🏆</div><div class="card-label">Melhor Mês</div><div class="card-value green">${melhorMes ? melhorMes.mesLabel : '-'}</div><div class="card-sub">${melhorMes ? formatCurrency(melhorMes.saldo) : ''}</div></div>
                    <div class="card"><div class="card-icon red">📉</div><div class="card-label">Pior Mês</div><div class="card-value red">${piorMes ? piorMes.mesLabel : '-'}</div><div class="card-sub">${piorMes ? formatCurrency(piorMes.saldo) : ''}</div></div>
                    <div class="card"><div class="card-icon purple">📊</div><div class="card-label">Média Mensal</div><div class="card-value purple">${formatCurrency(mediaMensal)}</div><div class="card-sub">Saldo médio</div></div>
                    <div class="card"><div class="card-icon yellow">✅</div><div class="card-label">Meses Positivos</div><div class="card-value yellow">${mesesPositivos}</div><div class="card-sub">De ${activeMonths.length} meses</div></div>
                `;
                $('#analiseCharts').innerHTML = `
                    <div class="chart-card"><div class="chart-title">Receitas × Despesas</div><canvas id="chart-analise-barras"></canvas></div>
                    <div class="chart-card"><div class="chart-title">Saldo Acumulado</div><canvas id="chart-analise-linha"></canvas></div>
                `;
                createBarChart('chart-analise-barras', monthData.map(m => m.mesLabel), [
                    { label: 'Receitas', data: monthData.map(m => m.receitas), backgroundColor: 'rgba(16,185,129,0.7)', borderRadius: 6 },
                    { label: 'Despesas', data: monthData.map(m => m.despesas), backgroundColor: 'rgba(239,68,68,0.7)', borderRadius: 6 },
                ]);
                createLineChart('chart-analise-linha', monthData.map(m => m.mesLabel),
                    [{ label: 'Saldo Acumulado', data: monthData.map(m => m.acumulado), borderColor: 'var(--accent)', backgroundColor: 'rgba(99,102,241,0.15)', fill: true, tension: 0.35 }]);
                renderTable('analiseTable', monthData.map(m => ({ ...m, isBest: melhorMes && m.mes === melhorMes.mes, isWorst: piorMes && m.mes === piorMes.mes })), [
                    { key: 'mesLabel', label: 'Mês' },
                    { key: 'receitas', label: 'Receitas', render: r => formatCurrency(r.receitas), getSortValue: r => r.receitas },
                    { key: 'despesas', label: 'Despesas', render: r => formatCurrency(r.despesas), getSortValue: r => r.despesas },
                    { key: 'saldo', label: 'Saldo', render: r => `<span style="color:${r.saldo>=0?'var(--green)':'var(--red)'}">${formatCurrency(r.saldo)}</span>`, getSortValue: r => r.saldo },
                    { key: 'margem', label: 'Margem (%)', render: r => `${r.margem.toFixed(1)}%`, getSortValue: r => r.margem },
                    { key: 'acumulado', label: 'Acumulado', render: r => formatCurrency(r.acumulado), getSortValue: r => r.acumulado },
                ], { sortColumn: null, sortDirection: 'asc' });
            }

            // ============ TOAST ============
            function showToast(message, type = 'info') {
                const container = $('#toastContainer');
                if (!container) return;
                const icons = { success: '✅', error: '❌', info: 'ℹ️' };
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<span class="toast-icon">${icons[type] || 'ℹ️'}</span> ${message}`;
                container.appendChild(toast);
                setTimeout(() => { toast.classList.add('removing'); setTimeout(() => toast.remove(), 300); }, 3500);
            }

            // ============ CLOCK ============
            function updateClock() {
                const el = $('#clock');
                if (el) el.textContent = new Date().toLocaleTimeString('pt-BR');
            }
            setInterval(updateClock, 1000);
            updateClock();

            // ============ EVENT HANDLERS ============
            $$('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    state.currentPage = page;
                    state.calendarSelectedDate = null;
                    renderCurrentPage();
                    closeMobileSidebar();
                });
            });

            $('#hamburgerBtn').addEventListener('click', () => {
                const sidebar = $('#sidebar');
                const overlay = $('#sidebarOverlay');
                if (sidebar.classList.contains('mobile-open')) {
                    closeMobileSidebar();
                } else {
                    sidebar.classList.add('mobile-open');
                    overlay.classList.add('visible');
                    state.mobileSidebarOpen = true;
                }
            });
            $('#sidebarOverlay').addEventListener('click', closeMobileSidebar);

            function closeMobileSidebar() {
                $('#sidebar').classList.remove('mobile-open');
                $('#sidebarOverlay').classList.remove('visible');
                state.mobileSidebarOpen = false;
            }

            function toggleDarkMode() {
                state.theme = state.theme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', state.theme);
                localStorage.setItem('dash_theme', state.theme);
                const btn = $('#btnDarkMode');
                if (btn) btn.innerHTML = state.theme === 'light' ? '🌙 <span>Dark Mode</span>' : '☀️ <span>Light Mode</span>';
                renderCurrentPage();
                showToast(`Tema ${state.theme === 'light' ? 'claro' : 'escuro'} ativado`, 'success');
            }
            $('#btnDarkMode').addEventListener('click', toggleDarkMode);

            $('#btnAtualizar').addEventListener('click', () => loadData(true));
            $('#btnImprimir').addEventListener('click', () => window.print());

            document.addEventListener('keydown', (e) => {
                const target = e.target;
                const isInput = target.tagName === 'INPUT' || target.tagName === 'SELECT' || target.tagName === 'TEXTAREA';
                if (isInput) return;
                const key = e.key.toLowerCase();
                if (key === 'r') { e.preventDefault(); loadData(true); }
                else if (key === 'd') { e.preventDefault(); toggleDarkMode(); }
                else if (key === 'p') { e.preventDefault(); window.print(); }
            });

            // ============ INIT ============
            function init() {
                document.documentElement.setAttribute('data-theme', state.theme);
                const btnDark = $('#btnDarkMode');
                if (btnDark) btnDark.innerHTML = state.theme === 'light' ? '🌙 <span>Dark Mode</span>' : '☀️ <span>Light Mode</span>';
                if (window.innerWidth > 768 && state.sidebarCollapsed) {
                    $('#sidebar').classList.add('collapsed');
                    $('#mainWrapper').classList.add('sidebar-collapsed');
                }
                updateClock();
                loadData(false);
            }

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    const sidebar = $('#sidebar');
                    if (state.sidebarCollapsed) {
                        sidebar.classList.add('collapsed');
                        $('#mainWrapper').classList.add('sidebar-collapsed');
                    } else {
                        sidebar.classList.remove('collapsed');
                        $('#mainWrapper').classList.remove('sidebar-collapsed');
                    }
                    closeMobileSidebar();
                }
            });

            init();
        })();
    </script>
</body>
</html>
